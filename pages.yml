# Configuration de Pages CMS pour le portfolio d’Axel Busquin.
# Le fichier content/site.json est la source unique du contenu public.

media:
  - name: docs
    label: Documents PDF
    input: media/docs
    output: /media/docs
    extensions: [pdf]
    rename: safe

settings:
  hide: true
  content:
    merge: false
  commit:
    identity: user
    templates:
      update: "Mise à jour du portfolio : {path}"
      create: "Ajout au portfolio : {path}"
      delete: "Suppression du portfolio : {path}"
      rename: "Renommage : {oldPath} -> {newPath}"

components:
  identite:
    type: object
    label: Identité et liens principaux
    fields:
      - name: name
        label: Nom complet
        type: string
        required: true
      - name: role
        label: Fonction / spécialité
        type: string
        required: true
      - name: location
        label: Localisation
        type: string
      - name: tagline
        label: Phrase de présentation
        type: text
        required: true
      - name: email
        label: Adresse e-mail
        type: string
        description: "Saisir uniquement l’adresse, sans « mailto: »."
      - name: cv_pdf
        label: CV au format PDF
        type: file
        options:
          media: docs
          extensions: [pdf]
          rename: safe
      - name: cv_url
        label: Lien externe vers le CV (facultatif)
        type: string
        description: Utilisé seulement si aucun CV PDF n’est déposé.
      - name: github_url
        label: URL du profil GitHub
        type: string
      - name: footer_note
        label: Texte du pied de page
        type: string
      - name: meta_description
        label: Description pour les moteurs de recherche
        type: text

  bloc_texte:
    type: object
    label: Texte libre
    fields:
      - name: published
        label: Visible sur le site
        type: boolean
        default: true
      - name: wide
        label: Afficher sur toute la largeur
        type: boolean
        default: false
      - name: statement
        label: Mettre le texte en valeur
        type: boolean
        default: false
      - name: kicker
        label: Petit titre supérieur
        type: string
      - name: title
        label: Titre
        type: string
        required: true
      - name: body
        label: Texte
        type: text
        required: true
      - name: tags
        label: Mots-clés
        type: string
        list: true
      - name: link_label
        label: Libellé du lien (facultatif)
        type: string
      - name: link_url
        label: URL du lien (facultatif)
        type: string

  bloc_parcours:
    type: object
    label: Parcours ou travail
    fields:
      - name: published
        label: Visible sur le site
        type: boolean
        default: true
      - name: label
        label: Type
        type: string
        description: "Exemple : Master, publication, expérience."
      - name: date
        label: Date ou établissement
        type: string
      - name: title
        label: Titre
        type: string
        required: true
      - name: body
        label: Description
        type: text
        required: true
      - name: status
        label: Statut
        type: string
      - name: tags
        label: Mots-clés
        type: string
        list: true
      - name: link_label
        label: Libellé du lien (facultatif)
        type: string
      - name: link_url
        label: URL du lien (facultatif)
        type: string

  bloc_projet:
    type: object
    label: Projet personnel
    fields:
      - name: published
        label: Visible sur le site
        type: boolean
        default: true
      - name: code
        label: Code court
        type: string
        description: "Exemple : 01, R, JEU."
      - name: status
        label: Statut
        type: string
      - name: title
        label: Titre
        type: string
        required: true
      - name: body
        label: Description
        type: text
        required: true
      - name: category
        label: Catégorie
        type: string
      - name: tags
        label: Mots-clés
        type: string
        list: true
      - name: link_label
        label: Libellé du lien (facultatif)
        type: string
      - name: link_url
        label: URL du lien (facultatif)
        type: string

  bloc_pdf:
    type: object
    label: Document PDF avec lecteur
    fields:
      - name: published
        label: Visible sur le site
        type: boolean
        default: true
      - name: status
        label: Statut ou date
        type: string
      - name: title
        label: Titre du document
        type: string
        required: true
      - name: body
        label: Présentation du document
        type: text
      - name: file
        label: Fichier PDF
        type: file
        options:
          media: docs
          extensions: [pdf]
          rename: safe
      - name: tags
        label: Mots-clés
        type: string
        list: true

  bloc_lien:
    type: object
    label: Ressource ou lien externe
    fields:
      - name: published
        label: Visible sur le site
        type: boolean
        default: true
      - name: symbol
        label: Symbole court
        type: string
        description: Deux ou trois caractères, par exemple EU, DB ou R.
      - name: category
        label: Catégorie
        type: string
      - name: title
        label: Nom de la ressource
        type: string
        required: true
      - name: body
        label: Description
        type: text
      - name: link_label
        label: Libellé du lien
        type: string
        default: Consulter →
      - name: link_url
        label: URL
        type: string
        required: true

  blocs_section:
    type: block
    label: Blocs de contenu
    list: true
    blockKey: type
    blocks:
      - name: texte
        label: Texte libre
        component: bloc_texte
      - name: parcours
        label: Parcours, publication ou expérience
        component: bloc_parcours
      - name: projet
        label: Projet personnel
        component: bloc_projet
      - name: pdf
        label: PDF avec lecteur intégré
        component: bloc_pdf
      - name: lien
        label: Ressource ou lien externe
        component: bloc_lien

  rubrique:
    type: object
    label: Rubrique
    fields:
      - name: nav_label
        label: Nom dans le menu
        type: string
        required: true
      - name: eyebrow
        label: Petit titre supérieur
        type: string
      - name: title
        label: Grand titre
        type: string
        required: true
      - name: intro
        label: Introduction
        type: text
      - name: blocks
        label: Blocs de la rubrique
        component: blocs_section

content:
  - name: portfolio
    label: Contenu du portfolio
    type: file
    path: content/site.json
    format: json
    fields:
      - name: profile
        label: Identité, CV et GitHub
        component: identite
      - name: biographie
        label: Biographie et CV
        component: rubrique
      - name: travaux
        label: Publications et travaux
        component: rubrique
      - name: projets
        label: Projets personnels
        component: rubrique
      - name: pedagogie
        label: Ressources pédagogiques
        component: rubrique
      - name: ressources
        label: Ressources utiles
        component: rubrique
